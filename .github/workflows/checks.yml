name: checks
on: [push, pull_request]
jobs:
  native-ui:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - run: pacman -Syu --noconfirm python pyside6 python-xlib
      - run: make test
      - run: bash -n PKGBUILD packaging/*.install packaging/parsecd
