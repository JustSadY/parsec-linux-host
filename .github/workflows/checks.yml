name: checks
on: [push, pull_request]
jobs:
  native-ui:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - run: pacman -Syu --noconfirm python jansson curl openssl systemd-libs pkgconf
      - run: make test
      - run: make native
      - run: bash -n PKGBUILD packaging/*.install packaging/parsecd tools/run-native.sh
